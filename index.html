<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商务活动邀请函</title><style>
:root{--ink:#07111f;--paper:#f5f1e9;--gold:#d0aa69;--line:rgba(245,241,233,.18);--dim:#b8c0c8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}.orb{position:fixed;z-index:-1;border-radius:50%;width:55vmax;height:55vmax;background:radial-gradient(circle,rgba(204,167,100,.2),transparent 67%);filter:blur(14px);animation:drift 12s ease-in-out infinite alternate}.orb.a{top:-34vmax;left:-26vmax}.orb.b{right:-32vmax;bottom:-34vmax;animation-delay:-6s}@keyframes drift{to{transform:translate(8vw,6vh) scale(1.12)}}main{max-width:1024px;margin:auto;padding:30px 28px 54px}.topline{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11px;letter-spacing:.2em}.brand{color:var(--paper);font-weight:600}.brand:before{content:"";display:inline-block;width:24px;height:1px;background:var(--gold);vertical-align:middle;margin:0 10px 3px 0}.edit{appearance:none;background:transparent;border:1px solid var(--line);color:var(--paper);padding:8px 11px;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.1em}.edit:hover{border-color:var(--gold);color:var(--gold)}.brief{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin:36px 0 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.brief span{font-size:11px;letter-spacing:.16em;color:var(--gold);display:block;margin-bottom:7px}.brief b{font-size:13px;line-height:1.55;font-weight:500}.welcome{min-height:calc(100vh - 190px);display:flex;flex-direction:column;justify-content:center;padding:66px 8px 40px}.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:28px}.guest{color:var(--dim);font-size:15px;letter-spacing:.12em;margin:0 0 16px}.guest strong{color:var(--paper);font-weight:500}h1{font:400 clamp(48px,8vw,108px)/1.08 Georgia,"Songti SC",serif;letter-spacing:.035em;margin:0;max-width:820px}.intro{max-width:560px;color:#d9dde0;line-height:2;margin:30px 0;font-size:16px;letter-spacing:.05em}.reveal{margin-top:10px;align-self:flex-start;border:0;background:var(--gold);color:#16120b;padding:14px 20px;font:600 12px "PingFang SC",sans-serif;letter-spacing:.14em;cursor:pointer;transition:transform .2s,background .2s}.reveal:hover{transform:translateY(-2px);background:#e2bf82}.hint{color:var(--dim);font-size:11px;letter-spacing:.1em;margin-top:15px}.details{display:none;padding:70px 8px 10px;opacity:0;transform:translateY(18px)}body.revealed .details{display:block;animation:enter .7s ease forwards}@keyframes enter{to{opacity:1;transform:none}}.section-title{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:500;margin:0 0 25px}.agenda{border-top:1px solid var(--line)}.agenda-row{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.6}.agenda-row time{color:var(--gold);font-variant-numeric:tabular-nums}.closing{margin:60px 0 5px;color:var(--dim);font-size:12px;letter-spacing:.1em}.rsvp{color:var(--paper);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:6px;margin-left:12px}.panel{position:fixed;z-index:5;inset:0 0 0 auto;width:min(430px,100%);padding:28px;overflow:auto;background:#0b1727;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .35s ease;box-shadow:-18px 0 50px rgba(0,0,0,.3)}body.editing .panel{transform:none}.panel h2{font-size:16px;letter-spacing:.12em;font-weight:500;margin:0 0 7px}.panel p{font-size:12px;color:var(--dim);line-height:1.7;margin:0 0 24px}.fields{display:grid;gap:13px}.fields label{display:grid;gap:6px;color:var(--gold);font-size:10px;letter-spacing:.13em}.fields input,.fields textarea{width:100%;padding:10px;background:#101f32;border:1px solid #314257;color:var(--paper);font:14px "PingFang SC",sans-serif;line-height:1.5;resize:vertical}.fields textarea{min-height:67px}.panel-actions{display:flex;gap:10px;margin-top:22px}.save,.cancel{padding:11px 15px;cursor:pointer;font:600 12px "PingFang SC",sans-serif;letter-spacing:.1em}.save{border:0;background:var(--gold);color:#16120b}.cancel{border:1px solid #405166;background:transparent;color:var(--paper)}@media(max-width:640px){main{padding:23px 20px 38px}.brief{grid-template-columns:1fr;gap:14px}.welcome{min-height:calc(100vh - 270px);padding-top:48px}.agenda-row{grid-template-columns:78px 1fr;gap:12px}.topline>span{display:none}}
</style></head><body><div class="orb a"></div><div class="orb b"></div><main><header class="topline"><div class="brand" id="brand">NOVA INSIGHTS</div><span>PRIVATE INVITATION · 2026</span><button class="edit" id="openEditor" type="button">编辑邀请函</button></header><section class="brief" aria-label="活动概要"><div><span>DATE</span><b id="date">2026.10.18 · 周日<br>14:00 — 18:30</b></div><div><span>VENUE</span><b id="venue">上海浦东嘉里大酒店<br>三层 · 大宴会厅</b></div><div><span>HOST</span><b id="host">NOVA INSIGHTS<br>战略与创新中心</b></div></section><section class="welcome"><div class="eyebrow" id="eyebrow">BUSINESS FORUM / 2026</div><p class="guest">致 <strong id="guest">尊敬的受邀嘉宾</strong></p><h1 id="title">远见共启<br>智创未来</h1><p class="intro" id="intro">诚邀您莅临年度商务交流会，与行业领袖及创新伙伴共同探讨趋势、连接机遇。</p><button class="reveal" id="reveal" type="button">开启活动详情</button><div class="hint">点击查看活动安排</div></section><section class="details" id="details"><h2 class="section-title">活动安排</h2><div class="agenda" id="agenda"></div><p class="closing">着商务正装出席 · 凭此函入场 <a class="rsvp" id="rsvp" href="mailto:rsvp@example.com?subject=商务活动报名">确认出席</a></p></section></main><aside class="panel" aria-label="编辑邀请函"><h2>编辑邀请函</h2><p>保存后会立即更新预览，并保存在此浏览器。</p><form class="fields" id="editor"><label>品牌 / 主办方<input name="brand"></label><label>活动标签<input name="eyebrow"></label><label>受邀人<input name="guest"></label><label>活动名称（用 &lt;br&gt; 换行）<textarea name="title"></textarea></label><label>活动简介<textarea name="intro"></textarea></label><label>日期与时间（用 &lt;br&gt; 换行）<textarea name="date"></textarea></label><label>地点（用 &lt;br&gt; 换行）<textarea name="venue"></textarea></label><label>主办信息（用 &lt;br&gt; 换行）<textarea name="host"></textarea></label><label>活动安排（每行：时间 | 内容）<textarea name="agenda"></textarea></label><label>报名邮箱<input name="email" type="email"></label><div class="panel-actions"><button class="save" type="submit">保存并预览</button><button class="cancel" id="closeEditor" type="button">取消</button></div></form></aside><script>
const defaults={brand:'NOVA INSIGHTS',eyebrow:'BUSINESS FORUM / 2026',guest:'尊敬的受邀嘉宾',title:'远见共启<br>智创未来',intro:'诚邀您莅临年度商务交流会，与行业领袖及创新伙伴共同探讨趋势、连接机遇。',date:'2026.10.18 · 周日<br>14:00 — 18:30',venue:'上海浦东嘉里大酒店<br>三层 · 大宴会厅',host:'NOVA INSIGHTS<br>战略与创新中心',agenda:'14:00 | 来宾签到与交流\n14:30 | 主旨演讲：重塑增长的下一个周期\n15:30 | 圆桌对谈：技术、组织与新机遇\n17:00 | 自由交流与商务酒会',email:'rsvp@example.com'};let data={...defaults,...JSON.parse(localStorage.getItem('invitation-data')||'{}')};const $=id=>document.getElementById(id);function html(v){return v.replace(/\n/g,'<br>')}function render(){['brand','eyebrow','guest','title','intro','date','venue','host'].forEach(k=>$(k).innerHTML=html(data[k]));$('agenda').innerHTML=data.agenda.split('\n').filter(Boolean).map(row=>{const [time,...copy]=row.split('|');return `<div class="agenda-row"><time>${time.trim()}</time><span>${copy.join('|').trim()}</span></div>`}).join('');$('rsvp').href=`mailto:${data.email}?subject=${encodeURIComponent('商务活动报名')}`;document.title=data.title.replace(/<br>/g,' ')}function fill(){Object.entries(data).forEach(([k,v])=>document.querySelector(`[name="${k}"]`).value=v)}$('openEditor').onclick=()=>{fill();document.body.classList.add('editing')};$('closeEditor').onclick=()=>document.body.classList.remove('editing');$('reveal').onclick=()=>{document.body.classList.add('revealed');$('details').scrollIntoView({behavior:'smooth',block:'start'})};$('editor').onsubmit=e=>{e.preventDefault();data=Object.fromEntries(new FormData(e.target));localStorage.setItem('invitation-data',JSON.stringify(data));render();document.body.classList.remove('editing')};render();
</script></body></html>
